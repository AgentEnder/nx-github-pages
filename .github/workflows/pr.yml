name: PR Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump NPM
        run: |
          npm i -g npm@10
          npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx nx run-many -t build,test,lint,e2e
